[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "komposoija"
version = "0.9.0"
description = "Backing tracks as code: Strudel-style patterns rendered to MIDI"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saku Rantamäki" }]
dependencies = ["mido>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
komposoija = "komposoija.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
