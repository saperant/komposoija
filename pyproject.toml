[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "komposoija"
version = "0.9.0"
description = "Backing tracks as code: Strudel-style patterns rendered to MIDI"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saku Rantamäki" }]
dependencies = ["mido>=1.3"]

[project.optional-dependencies]
# The user interface on the myrcp workbench: the komposoija-ui command.
ui = ["myrcp>=0.9; python_version >= '3.11'"]
dev = ["pytest>=8", "myrcp>=0.9; python_version >= '3.11'"]

[project.scripts]
komposoija = "komposoija.cli:main"
komposoija-ui = "komposoija.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

# The myrcp product: its manifest and the plugin, which the plugin host imports from
# its directory (not as komposoija's own subpackage).
[tool.setuptools.package-data]
"komposoija.ui" = ["product.toml", "plugins/*/myrcp.toml", "plugins/*/*/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
