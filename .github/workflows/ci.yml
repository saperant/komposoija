name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: komposoija
      # The myrcp SDK, for the myrcp plugin's tests (tests/myrcp_peer.py finds ../myrcp).
      - uses: actions/checkout@v4
        with:
          repository: saperant/myrcp
          path: myrcp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: komposoija
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e '.[dev]'
      - name: Test
        working-directory: komposoija
        run: .venv/bin/pytest -q

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fonts and Pango for WeasyPrint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-noto-core fonts-dejavu fonts-symbola fonts-stix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build build/music-theory.pdf
        run: scripts/build-docs-pdf.sh
      - uses: actions/upload-artifact@v4
        with:
          name: music-theory-pdf
          path: build/music-theory.pdf
          if-no-files-found: error

  release:
    # A tag v*: the PDF attached to a GitHub release of that tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: music-theory-pdf
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" music-theory.pdf --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
